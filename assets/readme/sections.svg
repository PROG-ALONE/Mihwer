<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">أقسام مِحوَر</title>
  <desc id="description">بطاقات ملونة لأقسام مِحوَر مرتبة من اليمين إلى اليسار.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#edf8f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4c3a86" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="610" rx="34" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="31" font-weight="800" fill="#24213a">كل ما تحتاجه في مكان واحد</text>
  <text x="600" y="105" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#79758f">أقسام صغيرة، وصورة أوضح ليومك</text>
  <g font-family="Tahoma, Arial, sans-serif" direction="rtl" filter="url(#shadow)">
    <g>
      <rect x="770" y="145" width="350" height="175" rx="24" fill="#fff" stroke="#7354e8" stroke-width="3"/>
      <rect x="1092" y="145" width="28" height="175" rx="14" fill="#7354e8"/>
      <circle cx="1035" cy="198" r="27" fill="#f0ecff"/><text x="1035" y="207" text-anchor="middle" font-size="22" fill="#7354e8">✓</text>
      <text x="1010" y="255" text-anchor="end" font-size="24" font-weight="800" fill="#24213a">المهام</text>
      <text x="1010" y="288" text-anchor="end" font-size="15" fill="#79758f">أولويات ومواعيد ومهام فرعية.</text>
    </g>
    <g>
      <rect x="425" y="145" width="350" height="175" rx="24" fill="#fff" stroke="#24a889" stroke-width="3"/>
      <rect x="747" y="145" width="28" height="175" rx="14" fill="#24a889"/>
      <circle cx="690" cy="198" r="27" fill="#e8f7f2"/><text x="690" y="207" text-anchor="middle" font-size="22" fill="#24a889">✦</text>
      <text x="665" y="255" text-anchor="end" font-size="24" font-weight="800" fill="#24213a">العادات</text>
      <text x="665" y="288" text-anchor="end" font-size="15" fill="#79758f">سلاسل وإنجاز يومي.</text>
    </g>
    <g>
      <rect x="80" y="145" width="350" height="175" rx="24" fill="#fff" stroke="#4d78d4" stroke-width="3"/>
      <rect x="402" y="145" width="28" height="175" rx="14" fill="#4d78d4"/>
      <circle cx="345" cy="198" r="27" fill="#eaf1ff"/><text x="345" y="207" text-anchor="middle" font-size="22" fill="#4d78d4">◉</text>
      <text x="320" y="255" text-anchor="end" font-size="24" font-weight="800" fill="#24213a">التركيز</text>
      <text x="320" y="288" text-anchor="end" font-size="15" fill="#79758f">جلسات واستراحات قابلة للتخصيص.</text>
    </g>
    <g>
      <rect x="770" y="370" width="350" height="175" rx="24" fill="#fff" stroke="#d7952d" stroke-width="3"/>
      <rect x="1092" y="370" width="28" height="175" rx="14" fill="#d7952d"/>
      <circle cx="1035" cy="423" r="27" fill="#fff4df"/><text x="1035" y="432" text-anchor="middle" font-size="22" fill="#d7952d">▤</text>
      <text x="1010" y="480" text-anchor="end" font-size="24" font-weight="800" fill="#24213a">اليوميات</text>
      <text x="1010" y="513" text-anchor="end" font-size="15" fill="#79758f">تدوين سريع مرتبط بيومك.</text>
    </g>
    <g>
      <rect x="425" y="370" width="350" height="175" rx="24" fill="#fff" stroke="#a14fd4" stroke-width="3"/>
      <rect x="747" y="370" width="28" height="175" rx="14" fill="#a14fd4"/>
      <circle cx="690" cy="423" r="27" fill="#f7eeff"/><text x="690" y="432" text-anchor="middle" font-size="22" fill="#a14fd4">◎</text>
      <text x="665" y="480" text-anchor="end" font-size="24" font-weight="800" fill="#24213a">الأهداف</text>
      <text x="665" y="513" text-anchor="end" font-size="15" fill="#79758f">اتجاه واضح لما تريد إنجازه.</text>
    </g>
    <g>
      <rect x="80" y="370" width="350" height="175" rx="24" fill="#fff" stroke="#269f82" stroke-width="3"/>
      <rect x="402" y="370" width="28" height="175" rx="14" fill="#269f82"/>
      <circle cx="345" cy="423" r="27" fill="#eaf9f4"/><text x="345" y="432" text-anchor="middle" font-size="22" fill="#269f82">↗</text>
      <text x="320" y="480" text-anchor="end" font-size="24" font-weight="800" fill="#24213a">التقدم</text>
      <text x="320" y="513" text-anchor="end" font-size="15" fill="#79758f">إحصائيات وتقارير وتصدير.</text>
    </g>
  </g>
</svg>
