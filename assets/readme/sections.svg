      <text x="945" y="255" text-anchor="middle" font-size="24" font-weight="800" fill="#24213a">المهام</text>
      <text x="945" y="288" text-anchor="middle" font-size="14" fill="#79758f">أولويات ومواعيد ومهام فرعية.</text>
    </g>
    <g>
      <rect x="425" y="160" width="350" height="175" rx="24" fill="#e1f7f0"/>
      <rect x="747" y="160" width="28" height="175" rx="14" fill="#24a889"/>
      <circle cx="690" cy="198" r="27" fill="#e8f7f2"/><text x="690" y="207" text-anchor="middle" font-size="22" fill="#24a889">✦</text>
      <text x="600" y="255" text-anchor="middle" font-size="24" font-weight="800" fill="#24213a">العادات</text>
      <text x="600" y="288" text-anchor="middle" font-size="14" fill="#79758f">سلاسل وإنجاز يومي.</text>
    </g>
    <g>
      <rect x="80" y="160" width="350" height="175" rx="24" fill="#e5efff"/>
      <rect x="402" y="160" width="28" height="175" rx="14" fill="#4d78d4"/>
      <circle cx="345" cy="198" r="27" fill="#eaf1ff"/><text x="345" y="207" text-anchor="middle" font-size="22" fill="#4d78d4">◉</text>
      <text x="255" y="255" text-anchor="middle" font-size="24" font-weight="800" fill="#24213a">التركيز</text>
      <text x="255" y="288" text-anchor="middle" font-size="14" fill="#79758f">جلسات واستراحات قابلة للتخصيص.</text>
    </g>
