<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
  <title id="title">أقسام مِحوَر</title>
  <desc id="description">ست بطاقات ملونة لأقسام المهام والعادات والتركيز واليوميات والأهداف والتقدم.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#fffaf1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#4c3a86" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="570" rx="34" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="29" font-weight="800" fill="#24213a">الأقسام</text>
  <g font-family="Tahoma, Arial, sans-serif" direction="rtl" text-anchor="middle" filter="url(#shadow)">
    <g>
      <rect x="55" y="105" width="345" height="170" rx="26" fill="#f0ecff"/>
      <circle cx="228" cy="156" r="25" fill="#7354e8"/>
      <text x="228" y="165" font-size="22" fill="#fff">✓</text>
      <text x="228" y="216" font-size="23" font-weight="800" fill="#24213a">المهام</text>
      <text x="228" y="248" font-size="15" fill="#79758f">أولويات ومواعيد ومهام فرعية.</text>
    </g>
    <g>
      <rect x="428" y="105" width="345" height="170" rx="26" fill="#e8f7f2"/>
      <circle cx="600" cy="156" r="25" fill="#24a889"/>
      <text x="600" y="166" font-size="23" fill="#fff">✦</text>
      <text x="600" y="216" font-size="23" font-weight="800" fill="#24213a">العادات</text>
      <text x="600" y="248" font-size="15" fill="#79758f">سلاسل وإنجاز يومي.</text>
    </g>
    <g>
      <rect x="800" y="105" width="345" height="170" rx="26" fill="#eaf1ff"/>
      <circle cx="972" cy="156" r="25" fill="#4d78d4"/>
      <text x="972" y="165" font-size="22" fill="#fff">◉</text>
      <text x="972" y="216" font-size="23" font-weight="800" fill="#24213a">التركيز</text>
      <text x="972" y="248" font-size="15" fill="#79758f">جلسات واستراحات قابلة للتخصيص.</text>
    </g>
    <g>
      <rect x="55" y="320" width="345" height="170" rx="26" fill="#fff4df"/>
      <circle cx="228" cy="371" r="25" fill="#d7952d"/>
      <text x="228" y="380" font-size="22" fill="#fff">▤</text>
      <text x="228" y="431" font-size="23" font-weight="800" fill="#24213a">اليوميات</text>
      <text x="228" y="463" font-size="15" fill="#79758f">تدوين سريع مرتبط بيومك.</text>
    </g>
    <g>
      <rect x="428" y="320" width="345" height="170" rx="26" fill="#f7eeff"/>
      <circle cx="600" cy="371" r="25" fill="#a14fd4"/>
      <text x="600" y="380" font-size="22" fill="#fff">◎</text>
      <text x="600" y="431" font-size="23" font-weight="800" fill="#24213a">الأهداف</text>
      <text x="600" y="463" font-size="15" fill="#79758f">اتجاه واضح لما تريد إنجازه.</text>
    </g>
    <g>
      <rect x="800" y="320" width="345" height="170" rx="26" fill="#eaf9f4"/>
      <circle cx="972" cy="371" r="25" fill="#269f82"/>
      <text x="972" y="380" font-size="22" fill="#fff">↗</text>
      <text x="972" y="431" font-size="23" font-weight="800" fill="#24213a">التقدم</text>
      <text x="972" y="463" font-size="15" fill="#79758f">إحصائيات وتقارير وتصدير.</text>
    </g>
  </g>
</svg>
