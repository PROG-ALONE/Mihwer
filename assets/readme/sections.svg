<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">أقسام مِحوَر</title>
  <desc id="description">بطاقات ملونة لأقسام مِحوَر مرتبة من اليمين إلى اليسار.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#edf8f4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4c3a86" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="610" rx="34" fill="#222b32"/>
  <text x="1135" y="48" text-anchor="end" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="800" fill="#f3f0ff">الأقسام</text>
  <path d="M45 70H1155" stroke="#4a5359" stroke-width="2"/>
  <rect x="35" y="90" width="1130" height="480" rx="28" fill="#f7f6fc"/>
  <g font-family="Tahoma, Arial, sans-serif" direction="rtl" filter="url(#shadow)">
