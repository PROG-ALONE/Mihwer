      <rect x="402" y="370" width="28" height="175" rx="14" fill="#269f82"/>
      <circle cx="345" cy="423" r="27" fill="#eaf9f4"/><text x="345" y="432" text-anchor="middle" font-size="22" fill="#269f82">↗</text>
      <text x="255" y="480" text-anchor="middle" font-size="24" font-weight="800" fill="#24213a">التقدم</text>
      <text x="255" y="513" text-anchor="middle" font-size="14" fill="#79758f">إحصائيات وتقارير وتصدير.</text>
