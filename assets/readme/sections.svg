      <rect x="1092" y="370" width="28" height="175" rx="14" fill="#d7952d"/>
      <circle cx="1035" cy="423" r="27" fill="#fff4df"/><text x="1035" y="432" text-anchor="middle" font-size="22" fill="#d7952d">▤</text>
      <text x="945" y="480" text-anchor="middle" font-size="24" font-weight="800" fill="#24213a">اليوميات</text>
      <text x="945" y="513" text-anchor="middle" font-size="14" fill="#79758f">تدوين سريع مرتبط بيومك.</text>
    </g>
    <g>
      <rect x="425" y="370" width="350" height="175" rx="24" fill="#f2e7ff"/>
      <rect x="747" y="370" width="28" height="175" rx="14" fill="#a14fd4"/>
      <circle cx="690" cy="423" r="27" fill="#f7eeff"/><text x="690" y="432" text-anchor="middle" font-size="22" fill="#a14fd4">◎</text>
      <text x="600" y="480" text-anchor="middle" font-size="24" font-weight="800" fill="#24213a">الأهداف</text>
      <text x="600" y="513" text-anchor="middle" font-size="14" fill="#79758f">اتجاه واضح لما تريد إنجازه.</text>
    </g>
    <g>
