<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">لوحة اليوم في مِحوَر</title>
  <desc id="description">لوحة اليوم مع نسبة الإنجاز والإحصائيات والاختصارات.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11101e"/><stop offset="1" stop-color="#25213b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d2c75" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <g font-family="Tahoma,Arial,sans-serif" direction="rtl">
    <rect x="54" y="44" width="1092" height="532" rx="28" fill="#f7f6fc"/>
    <rect x="54" y="44" width="1092" height="92" rx="28" fill="#1b1930"/>
    <rect x="86" y="69" width="48" height="48" rx="15" fill="#293b3e"/>
    <ellipse cx="110" cy="93" rx="16" ry="10" transform="rotate(-34 110 93)" fill="none" stroke="#f1e9d4" stroke-width="3"/>
    <circle cx="110" cy="93" r="4" fill="#f1e9d4"/>
    <text x="1092" y="83" text-anchor="start" fill="#aaa5c1" font-size="16">مساحة تنظيمك الشخصي</text>
    <text x="1092" y="116" text-anchor="start" fill="#f3f0ff" font-size="32" font-weight="800">اليوم</text>
    <rect x="88" y="164" width="1024" height="142" rx="24" fill="#fff" stroke="#d7ccfa" stroke-width="2" filter="url(#shadow)"/>
    <text x="1058" y="203" text-anchor="start" fill="#7354e8" font-size="17" font-weight="700">ملخص اليوم</text>
    <text x="1058" y="246" text-anchor="start" fill="#24213a" font-size="30" font-weight="800">مساحة هادئة لتبدأ</text>
    <text x="1058" y="278" text-anchor="start" fill="#79758f" font-size="15">٠ مهام · ٠ عادات · ٠ دقيقة تركيز</text>
    <text x="150" y="248" fill="#7354e8" font-size="60" font-weight="800">٠<tspan font-size="24">٪</tspan></text>
    <text x="150" y="278" fill="#79758f" font-size="14">إنجاز اليوم</text>
    <rect x="88" y="332" width="1024" height="104" rx="20" fill="#f0edfa"/>
    <g fill="#24213a" font-size="18" font-weight="700">
      <text x="1015" y="372">المهام</text><text x="760" y="372">العادات</text><text x="505" y="372">التركيز</text><text x="250" y="372">اليوميات</text>
    </g>
    <g fill="#79758f" font-size="14">
      <text x="1015" y="402">٠ قيد الإنجاز</text><text x="760" y="402">٠ مجدولة</text><text x="505" y="402">٠ دقيقة</text><text x="250" y="402">٠ تدوينات</text>
    </g>
    <rect x="88" y="466" width="1024" height="70" rx="18" fill="#eee9ff"/>
    <text x="1058" y="509" text-anchor="start" fill="#7354e8" font-size="18" font-weight="700">تذكير اليوم</text>
    <text x="830" y="509" fill="#24213a" font-size="16">خطوة صغيرة اليوم تصنع فرقاً كبيراً غداً.</text>
  </g>
</svg>
