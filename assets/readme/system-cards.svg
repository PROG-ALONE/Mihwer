<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">مساحات مِحوَر</title>
  <desc id="description">أربع بطاقات توضح اليوم والمهام والأهداف والعادات والصفحات الإضافية.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11101e"/>
      <stop offset="1" stop-color="#25213b"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6dfbc"/>
      <stop offset="1" stop-color="#63b89c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#background)"/>
  <text x="1140" y="58" text-anchor="start" direction="rtl" fill="#b6dfbc" font-family="Tahoma, Arial, sans-serif" font-size="18" font-weight="700">مساحات بسيطة، تختار منها ما تحتاج</text>
  <text x="1140" y="100" text-anchor="start" direction="rtl" fill="#f3f0ff" font-family="Tahoma, Arial, sans-serif" font-size="30" font-weight="800">كل شيء في مكانه</text>

  <g font-family="Tahoma, Arial, sans-serif" direction="rtl">
    <g>
      <rect x="625" y="132" width="530" height="205" rx="22" fill="#1b1930" stroke="#27d0aa" stroke-opacity=".65" stroke-width="2"/>
      <rect x="1080" y="155" width="48" height="48" rx="15" fill="#193a35"/>
      <path d="M1092 179l7 7 15-17" fill="none" stroke="#58dfb3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1063" y="184" text-anchor="start" fill="#9be5d2" font-size="22" font-weight="800">اليوم</text>
      <text x="1110" y="247" text-anchor="start" fill="#f3f0ff" font-size="17">ابدأ بما خُطّط له اليوم.</text>
      <text x="1110" y="282" text-anchor="start" fill="#aaa5c1" font-size="15">إنجاز سريع من دون تفاصيل زائدة.</text>
    </g>
    <g>
      <rect x="45" y="132" width="530" height="205" rx="22" fill="#1b1930" stroke="#a58aff" stroke-opacity=".7" stroke-width="2"/>
      <rect x="500" y="155" width="48" height="48" rx="15" fill="#30274f"/>
      <circle cx="524" cy="179" r="13" fill="none" stroke="#c6b8ff" stroke-width="3"/>
      <text x="483" y="184" text-anchor="start" fill="#c6b8ff" font-size="22" font-weight="800">المهام</text>
      <text x="530" y="247" text-anchor="start" fill="#f3f0ff" font-size="17">قائمة عادية وسريعة.</text>
      <text x="530" y="282" text-anchor="start" fill="#aaa5c1" font-size="15">الموعد والأولوية اختياريان.</text>
    </g>
    <g>
      <rect x="625" y="377" width="530" height="205" rx="22" fill="#1b1930" stroke="#ebc47e" stroke-opacity=".7" stroke-width="2"/>
      <rect x="1080" y="400" width="48" height="48" rx="15" fill="#3a2f1e"/>
      <circle cx="1104" cy="424" r="13" fill="none" stroke="#ebc47e" stroke-width="3"/>
      <circle cx="1104" cy="424" r="4" fill="#ebc47e"/>
      <text x="1063" y="429" text-anchor="start" fill="#f1ca83" font-size="22" font-weight="800">الأهداف والعادات</text>
      <text x="1110" y="492" text-anchor="start" fill="#f3f0ff" font-size="17">تابع ما يهمك فقط.</text>
      <text x="1110" y="527" text-anchor="start" fill="#aaa5c1" font-size="15">أضف هدفاً أو عادة وقتما تحتاج.</text>
    </g>
    <g>
      <rect x="45" y="377" width="530" height="205" rx="22" fill="#1b1930" stroke="#7ea2c8" stroke-opacity=".7" stroke-width="2"/>
      <rect x="500" y="400" width="48" height="48" rx="15" fill="#1e3448"/>
      <circle cx="512" cy="424" r="3" fill="#a9d2f3"/>
      <circle cx="524" cy="424" r="3" fill="#a9d2f3"/>
      <circle cx="536" cy="424" r="3" fill="#a9d2f3"/>
      <text x="483" y="429" text-anchor="start" fill="#a9d2f3" font-size="22" font-weight="800">المزيد</text>
      <text x="530" y="492" text-anchor="start" fill="#f3f0ff" font-size="17">اليوميات والتقارير والإعدادات.</text>
      <text x="530" y="527" text-anchor="start" fill="#aaa5c1" font-size="15">تظهر عند الحاجة، لا تزاحم يومك.</text>
    </g>
  </g>
  <rect x="64" y="594" width="1072" height="4" rx="2" fill="url(#mint)" opacity=".8"/>
</svg>
