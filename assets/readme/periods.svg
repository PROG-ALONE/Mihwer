<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">فترات مِحوَر الأربع</title>
  <desc id="description">تصوير مبسط لليوم والأسبوع والشهر والسنة مع بوكس أسبوع مدموج لسبعة أيام.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11101e"/>
      <stop offset="1" stop-color="#25213b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a58aff"/>
      <stop offset="1" stop-color="#27d0aa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <g font-family="Tahoma, Arial, sans-serif" direction="rtl">
    <text x="1135" y="58" text-anchor="start" fill="#b6dfbc" font-size="18" font-weight="700">لوحة واحدة، أربع زوايا للرؤية</text>
    <text x="1135" y="100" text-anchor="start" fill="#f3f0ff" font-size="30" font-weight="800">راجع إيقاعك بدون تكرار</text>
    <rect x="70" y="142" width="1060" height="74" rx="20" fill="#1b1930" stroke="#484067" stroke-width="2"/>
    <rect x="84" y="156" width="246" height="46" rx="13" fill="#30274f"/>
    <text x="207" y="186" text-anchor="middle" fill="#c6b8ff" font-size="17" font-weight="700">اليوم</text>
    <text x="470" y="186" text-anchor="middle" fill="#aaa5c1" font-size="17">الأسبوع</text>
    <text x="735" y="186" text-anchor="middle" fill="#aaa5c1" font-size="17">الشهر</text>
    <text x="1000" y="186" text-anchor="middle" fill="#aaa5c1" font-size="17">السنة</text>

    <rect x="70" y="248" width="250" height="112" rx="20" fill="#1b1930" stroke="#a58aff" stroke-width="2"/>
    <text x="287" y="282" text-anchor="start" fill="#c6b8ff" font-size="22" font-weight="800">اليوم</text>
    <text x="287" y="315" text-anchor="start" fill="#f3f0ff" font-size="15">إنجاز، تذكير، اختصارات</text>
    <text x="287" y="340" text-anchor="start" fill="#aaa5c1" font-size="13">من دون قوائم مكررة</text>

    <rect x="345" y="248" width="250" height="112" rx="20" fill="#1b1930" stroke="#27d0aa" stroke-width="2"/>
    <text x="562" y="282" text-anchor="start" fill="#9be5d2" font-size="22" font-weight="800">الأسبوع</text>
    <text x="562" y="315" text-anchor="start" fill="#f3f0ff" font-size="15">إحصائيات ثم بوكس الأيام</text>
    <g transform="translate(375 332)">
      <rect width="190" height="16" rx="8" fill="#25223d"/>
      <rect x="5" y="3" width="24" height="10" rx="5" fill="#a58aff"/>
      <rect x="32" y="3" width="24" height="10" rx="5" fill="#34304f"/>
      <rect x="59" y="3" width="24" height="10" rx="5" fill="#34304f"/>
      <rect x="86" y="3" width="24" height="10" rx="5" fill="#34304f"/>
      <rect x="113" y="3" width="24" height="10" rx="5" fill="#34304f"/>
      <rect x="140" y="3" width="24" height="10" rx="5" fill="#34304f"/>
      <rect x="167" y="3" width="18" height="10" rx="5" fill="#34304f"/>
    </g>

    <rect x="620" y="248" width="250" height="112" rx="20" fill="#1b1930" stroke="#ebc47e" stroke-width="2"/>
    <text x="837" y="282" text-anchor="start" fill="#f1ca83" font-size="22" font-weight="800">الشهر</text>
    <text x="837" y="315" text-anchor="start" fill="#f3f0ff" font-size="15">شبكة نشاط الأيام</text>
    <text x="837" y="340" text-anchor="start" fill="#aaa5c1" font-size="13">نظرة على الإيقاع العام</text>

    <rect x="895" y="248" width="235" height="112" rx="20" fill="#1b1930" stroke="#7ea2c8" stroke-width="2"/>
    <text x="1098" y="282" text-anchor="start" fill="#a9d2f3" font-size="22" font-weight="800">السنة</text>
    <text x="1098" y="315" text-anchor="start" fill="#f3f0ff" font-size="15">بطاقات الأشهر</text>
    <text x="1098" y="340" text-anchor="start" fill="#aaa5c1" font-size="13">نشاط كل شهر</text>
  </g>
  <rect x="70" y="390" width="1060" height="5" rx="3" fill="url(#accent)"/>
</svg>
