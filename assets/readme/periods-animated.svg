<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">فترات مِحوَر بالقيم المتحركة</title>
  <desc id="description">ملخص متحرك لليوم والأسبوع والشهر والسنة بقيم حقيقية وألوان الإنجاز.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11101e"/><stop offset="1" stop-color="#25213b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3d2c75" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="430" rx="30" fill="url(#background)"/>
  <g font-family="Tahoma,Arial,sans-serif" direction="rtl">
    <text x="1120" y="52" text-anchor="start" fill="#c6b8ff" font-size="18" font-weight="700">فترات مِحوَر</text>
    <text x="1120" y="90" text-anchor="start" fill="#f3f0ff" font-size="28" font-weight="800">صورة واحدة لإيقاعك الكامل</text>
    <text x="1120" y="117" text-anchor="start" fill="#aaa5c1" font-size="14">قيم حقيقية تتحرك بهدوء، من اليوم إلى السنة</text>
    <g filter="url(#shadow)">
      <g>
        <rect x="70" y="150" width="250" height="205" rx="22" fill="#eee9ff"/>
        <rect x="70" y="150" width="250" height="9" rx="4" fill="#7354e8"/>
        <text x="285" y="196" text-anchor="start" fill="#24213a" font-size="20" font-weight="800">اليوم</text>
        <text x="285" y="224" text-anchor="start" fill="#79758f" font-size="14">٣ مهام · ٣ عادات</text>
        <text x="285" y="286" text-anchor="start" fill="#7354e8" font-size="42" font-weight="800">٦٧٪<animate attributeName="opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/></text>
        <rect x="105" y="318" width="180" height="10" rx="5" fill="#dcd2ff"/>
        <rect x="105" y="318" width="121" height="10" rx="5" fill="#7354e8"><animate attributeName="width" values="95;145;95" dur="3s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="350" y="150" width="250" height="205" rx="22" fill="#fff3d9"/>
        <rect x="350" y="150" width="250" height="9" rx="4" fill="#d89b2b"/>
        <text x="565" y="196" text-anchor="start" fill="#24213a" font-size="20" font-weight="800">الأسبوع</text>
        <text x="565" y="224" text-anchor="start" fill="#79758f" font-size="14">٢٠ مهمة · ١٦ عادة</text>
        <text x="565" y="286" text-anchor="start" fill="#b57913" font-size="42" font-weight="800">٥٧٪<animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin=".3s" repeatCount="indefinite"/></text>
        <rect x="385" y="318" width="180" height="10" rx="5" fill="#ffe5ae"/>
        <rect x="385" y="318" width="103" height="10" rx="5" fill="#d89b2b"><animate attributeName="width" values="80;125;80" dur="3s" begin=".3s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="630" y="150" width="250" height="205" rx="22" fill="#e1f7f0"/>
        <rect x="630" y="150" width="250" height="9" rx="4" fill="#249b78"/>
        <text x="845" y="196" text-anchor="start" fill="#24213a" font-size="20" font-weight="800">الشهر</text>
        <text x="845" y="224" text-anchor="start" fill="#79758f" font-size="14">نوفمبر ٢٠٢٦</text>
        <text x="845" y="286" text-anchor="start" fill="#18785d" font-size="42" font-weight="800">٢٥ مهمة<animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin=".6s" repeatCount="indefinite"/></text>
        <rect x="665" y="318" width="180" height="10" rx="5" fill="#c9ecdf"/>
        <rect x="665" y="318" width="88" height="10" rx="5" fill="#249b78"><animate attributeName="width" values="65;108;65" dur="3s" begin=".6s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="910" y="150" width="220" height="205" rx="22" fill="#dfeaf5"/>
        <rect x="910" y="150" width="220" height="9" rx="4" fill="#5c82a8"/>
        <text x="1095" y="196" text-anchor="start" fill="#24213a" font-size="20" font-weight="800">السنة</text>
        <text x="1095" y="224" text-anchor="start" fill="#79758f" font-size="14">نشاط نوفمبر</text>
        <text x="1095" y="286" text-anchor="start" fill="#416886" font-size="36" font-weight="800">١٥ نشطة<animate attributeName="opacity" values=".55;1;.55" dur="2.4s" begin=".9s" repeatCount="indefinite"/></text>
        <rect x="945" y="318" width="150" height="10" rx="5" fill="#c6d9ea"/>
        <rect x="945" y="318" width="41" height="10" rx="5" fill="#5c82a8"><animate attributeName="width" values="30;62;30" dur="3s" begin=".9s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <text x="1120" y="395" text-anchor="start" fill="#aaa5c1" font-size="14">اليوم · المهام · العادات · تقدّمي · الإعدادات</text>
  </g>
</svg>
