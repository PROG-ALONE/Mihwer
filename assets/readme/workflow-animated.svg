<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">رحلة استخدام مِحوَر بالبطاقات المتحركة</title>
  <desc id="description">بطاقات مترابطة تمثل تبويبات اليوم والمهام والعادات والتركيز والتقدم والإعدادات.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11101e"/><stop offset="1" stop-color="#25213b"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2c2747"/><stop offset="1" stop-color="#1b1930"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#080711" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="470" rx="30" fill="url(#background)"/>
  <g font-family="Tahoma,Arial,sans-serif" direction="rtl">
    <text x="1130" y="52" text-anchor="start" fill="#c6b8ff" font-size="18" font-weight="700">رحلة مِحوَر</text>
    <text x="1130" y="88" text-anchor="start" fill="#f3f0ff" font-size="29" font-weight="800">من نية واضحة إلى مراجعة هادئة</text>
    <text x="1130" y="116" text-anchor="start" fill="#aaa5c1" font-size="14">كل بطاقة تمثل خطوة داخل النظام، والأسهم توضح التسلسل الطبيعي.</text>
    <g filter="url(#shadow)">
      <g>
        <rect x="1010" y="155" width="145" height="220" rx="20" fill="url(#card)" stroke="#7354e8" stroke-width="2"/>
        <circle cx="1082" cy="197" r="25" fill="#3a2f68"/>
        <path d="M1082 184v26M1069 197h26" stroke="#bcaaff" stroke-width="3" stroke-linecap="round"/>
        <text x="1082" y="252" text-anchor="middle" fill="#f3f0ff" font-size="20" font-weight="800">اليوم</text>
        <text x="1082" y="278" text-anchor="middle" fill="#aaa5c1" font-size="12">ابدأ من ملخصك</text>
        <rect x="1038" y="320" width="88" height="8" rx="4" fill="#43366f"/>
        <rect x="1038" y="320" width="52" height="8" rx="4" fill="#9b87ff"><animate attributeName="width" values="35;70;35" dur="2.8s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="820" y="155" width="145" height="220" rx="20" fill="url(#card)" stroke="#d89b2b" stroke-width="2"/>
        <circle cx="892" cy="197" r="25" fill="#4a3820"/>
        <path d="M880 198h24M892 186v24" stroke="#f1ca83" stroke-width="3" stroke-linecap="round"/>
        <text x="892" y="252" text-anchor="middle" fill="#f3f0ff" font-size="20" font-weight="800">المهام</text>
        <text x="892" y="278" text-anchor="middle" fill="#aaa5c1" font-size="12">خطط ونفّذ</text>
        <rect x="848" y="320" width="88" height="8" rx="4" fill="#5b4526"/>
        <rect x="848" y="320" width="63" height="8" rx="4" fill="#d89b2b"><animate attributeName="width" values="45;78;45" dur="2.8s" begin=".25s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="630" y="155" width="145" height="220" rx="20" fill="url(#card)" stroke="#249b78" stroke-width="2"/>
        <circle cx="702" cy="197" r="25" fill="#1d4e42"/>
        <path d="M689 198l8 8 17-19" fill="none" stroke="#8be0c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="702" y="252" text-anchor="middle" fill="#f3f0ff" font-size="20" font-weight="800">العادات</text>
        <text x="702" y="278" text-anchor="middle" fill="#aaa5c1" font-size="12">ثبّت ما يتكرر</text>
        <rect x="658" y="320" width="88" height="8" rx="4" fill="#245844"/>
        <rect x="658" y="320" width="70" height="8" rx="4" fill="#249b78"><animate attributeName="width" values="52;82;52" dur="2.8s" begin=".5s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="440" y="155" width="145" height="220" rx="20" fill="url(#card)" stroke="#5c82a8" stroke-width="2"/>
        <circle cx="512" cy="197" r="25" fill="#28425a"/>
        <path d="M512 183v15l10 6" fill="none" stroke="#a9d2f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="512" y="252" text-anchor="middle" fill="#f3f0ff" font-size="20" font-weight="800">التركيز</text>
        <text x="512" y="278" text-anchor="middle" fill="#aaa5c1" font-size="12">احسب وقتك</text>
        <rect x="468" y="320" width="88" height="8" rx="4" fill="#34516b"/>
        <rect x="468" y="320" width="42" height="8" rx="4" fill="#5c82a8"><animate attributeName="width" values="30;72;30" dur="2.8s" begin=".75s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="250" y="155" width="145" height="220" rx="20" fill="url(#card)" stroke="#27b699" stroke-width="2"/>
        <circle cx="322" cy="197" r="25" fill="#1d4e42"/>
        <path d="M310 198h24M322 186v24" stroke="#8be0c8" stroke-width="3" stroke-linecap="round"/>
        <text x="322" y="252" text-anchor="middle" fill="#f3f0ff" font-size="20" font-weight="800">تقدّمي</text>
        <text x="322" y="278" text-anchor="middle" fill="#aaa5c1" font-size="12">افهم الاتجاه</text>
        <rect x="278" y="320" width="88" height="8" rx="4" fill="#245844"/>
        <rect x="278" y="320" width="62" height="8" rx="4" fill="#27b699"><animate attributeName="width" values="42;80;42" dur="2.8s" begin="1s" repeatCount="indefinite"/></rect>
      </g>
      <g>
        <rect x="60" y="155" width="145" height="220" rx="20" fill="url(#card)" stroke="#a58aff" stroke-width="2"/>
        <circle cx="132" cy="197" r="25" fill="#3a2f68"/>
        <path d="M121 197h22M132 186v22" stroke="#bcaaff" stroke-width="3" stroke-linecap="round"/>
        <text x="132" y="252" text-anchor="middle" fill="#f3f0ff" font-size="20" font-weight="800">الإعدادات</text>
        <text x="132" y="278" text-anchor="middle" fill="#aaa5c1" font-size="12">اضبط تجربتك</text>
        <rect x="88" y="320" width="88" height="8" rx="4" fill="#43366f"/>
        <rect x="88" y="320" width="55" height="8" rx="4" fill="#a58aff"><animate attributeName="width" values="38;75;38" dur="2.8s" begin="1.25s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <g fill="none" stroke="#6e61a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M994 265h-22m0 0 8-8m-8 8 8 8"/>
      <path d="M804 265h-22m0 0 8-8m-8 8 8 8"/>
      <path d="M614 265h-22m0 0 8-8m-8 8 8 8"/>
      <path d="M424 265h-22m0 0 8-8m-8 8 8 8"/>
      <animate attributeName="stroke-opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <text x="600" y="420" text-anchor="middle" fill="#aaa5c1" font-size="14">اليوم ← المهام ← العادات ← التركيز ← تقدّمي ← الإعدادات</text>
  </g>
</svg>
