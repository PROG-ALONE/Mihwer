<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title description">
  <title id="title">خلاصة متحركة لتبويبات مِحوَر</title>
  <desc id="description">معاينة لأربع تبويبات ببيانات توضيحية: اليوم والمهام والعادات والتقدم الأسبوعي.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6f3ff"/>
      <stop offset="1" stop-color="#e8e4fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#51458d" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="510" rx="30" fill="url(#background)"/>

  <g font-family="Tahoma,Arial,sans-serif">
    <text x="1135" y="52" text-anchor="end" fill="#6d52da" font-size="17" font-weight="700">لمحة من مِحوَر</text>
    <text x="1135" y="91" text-anchor="end" fill="#24213a" font-size="30" font-weight="800">كل يوم أوضح، وخطواتك في مكان واحد</text>
    <text x="1135" y="120" text-anchor="end" fill="#79758f" font-size="15">ملخص بصري متحرك لبعض التبويبات — بيانات توضيحية</text>

    <g filter="url(#shadow)">
      <g>
        <rect x="895" y="150" width="245" height="310" rx="22" fill="#fff" stroke="#cfc3fb" stroke-width="2"/>
        <rect x="895" y="150" width="245" height="8" rx="4" fill="#7354e8"/>
        <circle cx="1017" cy="194" r="23" fill="#eee9ff"/>
        <path d="M1017 182v24M1005 194h24" stroke="#7354e8" stroke-width="3" stroke-linecap="round"/>
        <text x="1017" y="239" text-anchor="middle" fill="#7354e8" font-size="20" font-weight="800">اليوم</text>
        <text x="1017" y="266" text-anchor="middle" fill="#79758f" font-size="13">ملخص إنجازك اليومي</text>
        <text x="1017" y="321" text-anchor="middle" fill="#7354e8" font-size="38" font-weight="800">٦٧٪<animate attributeName="opacity" values=".65;1;.65" dur="2.6s" repeatCount="indefinite"/></text>
        <text x="1017" y="345" text-anchor="middle" fill="#79758f" font-size="12">نسبة الإنجاز</text>
        <rect x="925" y="363" width="185" height="10" rx="5" fill="#eee9ff"/>
        <rect x="925" y="363" width="124" height="10" rx="5" fill="#7354e8"><animate attributeName="width" values="95;150;95" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="925" y="395" width="84" height="38" rx="12" fill="#eef9f5"/>
        <text x="967" y="419" text-anchor="middle" fill="#18785d" font-size="13" font-weight="700">٣ مهام</text>
        <rect x="1021" y="395" width="89" height="38" rx="12" fill="#fff5df"/>
        <text x="1065" y="419" text-anchor="middle" fill="#a16b12" font-size="13" font-weight="700">٣ عادات</text>
      </g>

      <g>
        <rect x="620" y="150" width="245" height="310" rx="22" fill="#fff" stroke="#efd6a4" stroke-width="2"/>
        <rect x="620" y="150" width="245" height="8" rx="4" fill="#d89b2b"/>
        <circle cx="742" cy="194" r="23" fill="#fff3d9"/>
        <path d="M731 194h22M742 183v22" stroke="#b57913" stroke-width="3" stroke-linecap="round"/>
        <text x="742" y="239" text-anchor="middle" fill="#b57913" font-size="20" font-weight="800">المهام</text>
        <text x="742" y="266" text-anchor="middle" fill="#79758f" font-size="13">رتّب أولوياتك وأنجزها</text>
        <text x="742" y="310" text-anchor="middle" fill="#24213a" font-size="25" font-weight="800">٤٠ مهمة<animate attributeName="opacity" values=".65;1;.65" dur="2.6s" begin=".25s" repeatCount="indefinite"/></text>
        <rect x="650" y="328" width="185" height="34" rx="10" fill="#fff8e9"/>
        <circle cx="669" cy="345" r="6" fill="#d89b2b"/>
        <text x="817" y="350" text-anchor="end" fill="#39354c" font-size="12">إنهاء المهمة الأساسية</text>
        <rect x="650" y="371" width="185" height="34" rx="10" fill="#eef9f5"/>
        <circle cx="669" cy="388" r="6" fill="#249b78"/>
        <text x="817" y="393" text-anchor="end" fill="#39354c" font-size="12">جلسة تعلم قصيرة</text>
        <rect x="650" y="414" width="185" height="28" rx="9" fill="#fff0ef"/>
        <circle cx="669" cy="428" r="6" fill="#d9534f"/>
        <text x="817" y="432" text-anchor="end" fill="#39354c" font-size="12">مراجعة نهاية اليوم</text>
        <circle cx="669" cy="345" r="6" fill="#d89b2b"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
      </g>

      <g>
        <rect x="345" y="150" width="245" height="310" rx="22" fill="#fff" stroke="#b8dacf" stroke-width="2"/>
        <rect x="345" y="150" width="245" height="8" rx="4" fill="#249b78"/>
        <circle cx="467" cy="194" r="23" fill="#e1f7f0"/>
        <path d="M456 194l8 8 15-17" fill="none" stroke="#18785d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="467" y="239" text-anchor="middle" fill="#18785d" font-size="20" font-weight="800">العادات</text>
        <text x="467" y="266" text-anchor="middle" fill="#79758f" font-size="13">خطوات صغيرة تتكرر</text>
        <text x="467" y="310" text-anchor="middle" fill="#24213a" font-size="25" font-weight="800">٤ عادات</text>
        <text x="560" y="342" text-anchor="end" fill="#39354c" font-size="12">شرب الماء</text>
        <rect x="375" y="354" width="185" height="8" rx="4" fill="#e7f2ee"/>
        <rect x="375" y="354" width="148" height="8" rx="4" fill="#249b78"><animate attributeName="width" values="120;165;120" dur="3s" begin=".4s" repeatCount="indefinite"/></rect>
        <text x="560" y="389" text-anchor="end" fill="#39354c" font-size="12">قراءة هادئة</text>
        <rect x="375" y="401" width="185" height="8" rx="4" fill="#e7f2ee"/>
        <rect x="375" y="401" width="111" height="8" rx="4" fill="#249b78"><animate attributeName="width" values="90;145;90" dur="3s" begin=".7s" repeatCount="indefinite"/></rect>
        <text x="560" y="436" text-anchor="end" fill="#39354c" font-size="12">مشي يومي</text>
        <rect x="375" y="445" width="185" height="6" rx="3" fill="#e7f2ee"/>
        <rect x="375" y="445" width="129" height="6" rx="3" fill="#249b78"><animate attributeName="width" values="100;155;100" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
      </g>

      <g>
        <rect x="70" y="150" width="245" height="310" rx="22" fill="#fff" stroke="#b8dacf" stroke-width="2"/>
        <rect x="70" y="150" width="245" height="8" rx="4" fill="#249b78"/>
        <circle cx="192" cy="194" r="23" fill="#e1f7f0"/>
        <path d="M181 201v-14M192 201v-23M203 201v-9" stroke="#18785d" stroke-width="4" stroke-linecap="round"/>
        <text x="192" y="239" text-anchor="middle" fill="#18785d" font-size="20" font-weight="800">تقدّمي</text>
        <text x="192" y="266" text-anchor="middle" fill="#79758f" font-size="13">تابع مسارك أسبوعيًا</text>
        <text x="192" y="321" text-anchor="middle" fill="#249b78" font-size="38" font-weight="800">٥٧٪<animate attributeName="opacity" values=".65;1;.65" dur="2.6s" begin=".5s" repeatCount="indefinite"/></text>
        <text x="192" y="345" text-anchor="middle" fill="#79758f" font-size="12">إنجاز الأسبوع</text>
        <g>
          <rect x="105" y="421" width="28" height="20" rx="5" fill="#d9534f"><animate attributeName="height" values="20;35;20" dur="2.8s" repeatCount="indefinite"/></rect>
          <rect x="143" y="401" width="28" height="40" rx="5" fill="#d89b2b"><animate attributeName="height" values="40;25;40" dur="2.8s" begin=".2s" repeatCount="indefinite"/></rect>
          <rect x="181" y="377" width="28" height="64" rx="5" fill="#249b78"><animate attributeName="height" values="64;75;64" dur="2.8s" begin=".4s" repeatCount="indefinite"/></rect>
          <rect x="219" y="393" width="28" height="48" rx="5" fill="#7354e8"><animate attributeName="height" values="48;34;48" dur="2.8s" begin=".6s" repeatCount="indefinite"/></rect>
          <rect x="257" y="410" width="28" height="31" rx="5" fill="#5c82a8"><animate attributeName="height" values="31;44;31" dur="2.8s" begin=".8s" repeatCount="indefinite"/></rect>
        </g>
      </g>
    </g>
    <text x="600" y="488" text-anchor="middle" fill="#79758f" font-size="13">بيانات توضيحية لعرض الواجهة — تتغير الأرقام وفق بياناتك داخل التطبيق</text>
  </g>
</svg>
