<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">مِحوَر — لوحة اليوم الهادئة</title>
  <desc id="description">معاينة توضيحية للوحة اليوم في مِحوَر، مع نسبة إنجاز وإحصائيات واختصارات واضحة.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11101e"/>
      <stop offset="1" stop-color="#25213b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6dfbc"/>
      <stop offset="1" stop-color="#63b89c"/>
    </linearGradient>
    <linearGradient id="icon-background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#293b3e"/>
      <stop offset="1" stop-color="#17282e"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a58aff"/>
      <stop offset="1" stop-color="#27d0aa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="30" fill="url(#background)"/>
  <circle cx="1110" cy="35" r="205" fill="#7658e8" opacity=".1"/>
  <circle cx="22" cy="465" r="180" fill="#27d0aa" opacity=".08"/>

  <g transform="translate(64 52)">
    <rect width="560" height="376" rx="26" fill="#1b1930" stroke="#484067" stroke-width="2"/>
    <rect x="22" y="20" width="48" height="48" rx="15" fill="url(#icon-background)"/>
    <ellipse cx="46" cy="44" rx="17" ry="10" transform="rotate(-34 46 44)" fill="none" stroke="#f1e9d4" stroke-width="3"/>
    <circle cx="46" cy="44" r="4" fill="#f1e9d4"/>
    <text x="536" y="48" text-anchor="start" direction="rtl" fill="#f3f0ff" font-family="Tahoma, Arial, sans-serif" font-size="21" font-weight="700">الأحد، 1 نوفمبر</text>

    <rect x="22" y="82" width="516" height="76" rx="17" fill="#25223d"/>
    <circle cx="488" cy="120" r="23" fill="#193a35"/>
    <path d="M477 120l8 8 15-17" fill="none" stroke="#58dfb3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="448" y="113" text-anchor="start" direction="rtl" fill="#aaa5c1" font-family="Tahoma, Arial, sans-serif" font-size="13">ملخص اليوم</text>
    <text x="448" y="137" text-anchor="start" direction="rtl" fill="#f3f0ff" font-family="Tahoma, Arial, sans-serif" font-size="17" font-weight="700">إيقاع هادئ وواضح</text>
    <rect x="48" y="116" width="145" height="8" rx="4" fill="#393451"/>
    <rect x="48" y="116" width="92" height="8" rx="4" fill="url(#progress)"/>

    <g font-family="Tahoma, Arial, sans-serif" font-size="15">
      <rect x="22" y="171" width="516" height="47" rx="13" fill="#25223d"/>
      <circle cx="500" cy="194" r="9" fill="#27d0aa"/>
      <path d="M496 194l3 3 6-7" fill="none" stroke="#11101e" stroke-width="2" stroke-linecap="round"/>
      <text x="476" y="199" text-anchor="start" direction="rtl" fill="#aaa5c1">المهام</text>
      <text x="50" y="199" fill="#58dfb3" font-size="12">إحصاء</text>

      <rect x="22" y="227" width="516" height="47" rx="13" fill="#25223d"/>
      <circle cx="500" cy="250" r="9" fill="none" stroke="#a58aff" stroke-width="2"/>
      <text x="476" y="255" text-anchor="start" direction="rtl" fill="#f3f0ff">العادات</text>
      <text x="50" y="255" fill="#aaa5c1" font-size="12">إحصاء</text>

      <rect x="22" y="283" width="516" height="47" rx="13" fill="#25223d"/>
      <circle cx="500" cy="306" r="9" fill="none" stroke="#a58aff" stroke-width="2"/>
      <text x="476" y="311" text-anchor="start" direction="rtl" fill="#f3f0ff">التركيز واليوميات</text>
      <text x="50" y="311" fill="#aaa5c1" font-size="12">إحصاء</text>
    </g>

    <rect x="22" y="341" width="516" height="25" rx="12" fill="#171526"/>
    <g fill="#c6b8ff" font-family="Tahoma, Arial, sans-serif" font-size="11" text-anchor="middle">
      <text x="93" y="358">اليوم</text>
      <text x="216" y="358">الأسبوع</text>
      <text x="340" y="358">الشهر</text>
      <text x="463" y="358">السنة</text>
    </g>
  </g>

  <g font-family="Tahoma, Arial, sans-serif" direction="rtl">
    <rect x="704" y="83" width="82" height="82" rx="24" fill="url(#icon-background)"/>
    <ellipse cx="745" cy="124" rx="29" ry="17" transform="rotate(-34 745 124)" fill="none" stroke="#f1e9d4" stroke-width="5"/>
    <path d="M716 124h58" stroke="#f1e9d4" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="745" cy="124" r="8" fill="#f1e9d4"/>
    <circle cx="769" cy="108" r="4" fill="#ebc47e"/>
    <text x="1120" y="122" text-anchor="start" fill="#b6dfbc" font-size="18" font-weight="700">مساحة هادئة ليومك</text>
    <text x="1120" y="218" text-anchor="start" fill="#f3f0ff" font-size="64" font-weight="800">مِحوَر</text>
    <text x="1120" y="269" text-anchor="start" fill="#e5e0f5" font-size="25" font-weight="700">خطّط بلطف، وأنجز ما يهمك</text>
    <text x="1120" y="313" text-anchor="start" fill="#aaa5c1" font-size="17">أضف المهمة أولاً؛ التفاصيل عند الحاجة.</text>
    <rect x="704" y="350" width="182" height="42" rx="21" fill="#30274f"/>
    <text x="795" y="377" text-anchor="middle" fill="#d9ceff" font-size="14" font-weight="700">بداية بسيطة</text>
    <rect x="902" y="350" width="182" height="42" rx="21" fill="#193a35"/>
    <text x="993" y="377" text-anchor="middle" fill="#9be5d2" font-size="14" font-weight="700">بياناتك محلية</text>
  </g>
</svg>
