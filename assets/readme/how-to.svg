<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">كيف تستخدم مِحوَر؟</title>
  <desc id="description">أربع بطاقات باستيل تشرح إضافة المهمة ومتابعة اليوم والتسجيل والمراجعة.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4c3a86" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="#222b32"/>
  <text x="1080" y="46" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="800" fill="#f3f0ff">كيف تستخدم مِحوَر؟</text>
  <path d="M45 70H1155" stroke="#4a5359" stroke-width="2"/>
  <rect x="35" y="90" width="1130" height="350" rx="28" fill="#f7f6fc"/>
  <text x="600" y="137" text-anchor="middle" direction="rtl" font-family="Tahoma, Arial, sans-serif" font-size="25" font-weight="800" fill="#24213a">كيف تستخدم مِحوَر؟</text>
  <g font-family="Tahoma, Arial, sans-serif" direction="rtl" text-anchor="middle" filter="url(#shadow)">
    <g>
      <rect x="80" y="175" width="245" height="215" rx="24" fill="#fff0ef"/>
      <circle cx="202" cy="225" r="28" fill="#d9534f"/><text x="202" y="235" font-size="24" fill="#fff">١</text>
      <text x="202" y="285" font-size="23" font-weight="800" fill="#24213a">أضف</text>
      <text x="202" y="320" font-size="14" fill="#79758f">اكتب المهمة وحدد</text><text x="202" y="345" font-size="14" fill="#79758f">الأولوية.</text>
    </g>
    <g>
      <rect x="345" y="175" width="245" height="215" rx="24" fill="#e1f7f0"/>
      <circle cx="467" cy="225" r="28" fill="#249b78"/><text x="467" y="235" font-size="24" fill="#fff">٢</text>
      <text x="467" y="285" font-size="23" font-weight="800" fill="#24213a">تابع</text>
      <text x="467" y="320" font-size="14" fill="#79758f">راجع يومك أو</text><text x="467" y="345" font-size="14" fill="#79758f">أسبوعك.</text>
    </g>
    <g>
      <rect x="610" y="175" width="245" height="215" rx="24" fill="#fff3d9"/>
      <circle cx="732" cy="225" r="28" fill="#d89b2b"/><text x="732" y="235" font-size="24" fill="#fff">٣</text>
      <text x="732" y="285" font-size="23" font-weight="800" fill="#24213a">سجّل</text>
      <text x="732" y="320" font-size="14" fill="#79758f">أضف عادة أو جلسة</text><text x="732" y="345" font-size="14" fill="#79758f">تركيز أو يومية.</text>
    </g>
    <g>
      <rect x="875" y="175" width="245" height="215" rx="24" fill="#e8efff"/>
      <circle cx="997" cy="225" r="28" fill="#7354e8"/><text x="997" y="235" font-size="24" fill="#fff">٤</text>
      <text x="997" y="285" font-size="23" font-weight="800" fill="#24213a">راجع</text>
      <text x="997" y="320" font-size="14" fill="#79758f">اقرأ أرقامك</text><text x="997" y="345" font-size="14" fill="#79758f">وصدّر تقاريرك.</text>
    </g>
  </g>
</svg>
